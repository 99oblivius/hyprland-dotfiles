# -----------------------------------------------------
# Environment Variables
# name: "Nvidia"
# -----------------------------------------------------

# Configure monitors by description (handles DP port changes between boots)
exec-once = ~/.config/hypr/scripts/oblivius-monitor-setup.sh

# Start awww wallpaper daemon and set unique wallpapers per monitor
# Delay allows ml4w wallpaper-restore.sh to complete first, then we override
exec-once = awww-daemon && sleep 3 && ~/.config/hypr/scripts/oblivius-wallpaper.sh

env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

# Default Settings in ml4w.conf

# NVIDIA https://wiki.hyprland.org/Nvidia/
env = GBM_BACKEND,nvidia-drm
env = LIBVA_DRIVER_NAME,nvidia
# SDL_VIDEODRIVER=wayland removed: breaks VRChat EAC splash; set per-app where needed.
# WLR_DRM_NO_ATOMIC: leave unset on Hyprland 0.55+ + nvidia-open (atomic path is required).
env = __GL_VRR_ALLOWED,1
env = __GL_GSYNC_ALLOWED,1
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __NV_PRIME_RENDER_OFFLOAD,1
env = __VK_LAYER_NV_optimus,NVIDIA_only

# WLR_NO_HARDWARE_CURSORS / WLR_RENDERER_ALLOW_SOFTWARE removed:
# wlroots-era variables, no-op on Aquamarine. Cursor handling lives in cursor:no_hardware_cursors.

# nvidia firefox (for hardware acceleration on FF)?
# check this post https://github.com/elFarto/nvidia-vaapi-driver#configuration
env = MOZ_DISABLE_RDD_SANDBOX,1
env = EGL_PLATFORM,wayland

# nvidia-vaapi-driver backend (direct is better for screen sharing)
env = NVD_BACKEND,direct

# Pin video decode to primary GPU (RTX 4090)
env = NVD_GPU,GPU-6967ffb0-2efe-a8f7-a341-b1bed6e0ad75
