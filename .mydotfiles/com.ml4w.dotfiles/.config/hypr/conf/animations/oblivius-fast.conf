# -----------------------------------------------------
# Animations
# name "Oblivius-Fast"
# Hyprland 0.55: real springs require Lua config (hl.curve(type="spring",...)).
# Hyprlang has no spring keyword — these beziers approximate a snappy
# critically/lightly-damped spring (fast rise, tiny overshoot, quick settle).
# -----------------------------------------------------
animations {
    enabled = true

    # ---------------------------------------------------
    # Active curves — calmer spring approximations
    # Lower overshoot, longer settle than the first iteration.
    # ---------------------------------------------------
    # spring_snap: light overshoot (~5%), unhurried rise
    bezier = spring_snap, 0.25, 1.05, 0.45, 1.0
    # spring_tight: critically damped, no overshoot
    bezier = spring_tight, 0.32, 1.0, 0.5, 1.0
    # spring_pop: small overshoot (~10%) for popins
    bezier = spring_pop, 0.25, 1.10, 0.45, 1.0

    # ---------------------------------------------------
    # Active animation bindings
    # Speed values are in deciseconds (3.6 = 360 ms); higher = slower.
    # ---------------------------------------------------
    animation = windows,          1, 3.8, spring_snap,  popin 60%
    animation = windowsIn,        1, 3.4, spring_pop,   popin 80%
    animation = windowsOut,       1, 3.0, spring_tight, popin 80%
    animation = border,           1, 10,  spring_tight
    animation = fade,             1, 2.8, spring_tight
    animation = workspaces,       1, 4.2, spring_snap,  slide
    animation = specialWorkspace, 1, 3.8, spring_snap,  slidevert

    # ---------------------------------------------------
    # Previous bezier set (kept for quick rollback)
    # ---------------------------------------------------
    # bezier = linear,        0,    0,    1,    1
    # bezier = md3_standard,  0.2,  0,    0,    1
    # bezier = md3_decel,     0.05, 0.7,  0.1,  1
    # bezier = md3_accel,     0.3,  0,    0.8,  0.15
    # bezier = overshot,      0.05, 0.9,  0.1,  1.1
    # bezier = crazyshot,     0.1,  1.5,  0.76, 0.92
    # bezier = hyprnostretch, 0.05, 0.9,  0.1,  1.0
    # bezier = fluent_decel,  0.1,  1,    0,    1
    # bezier = easeInOutCirc, 0.85, 0,    0.15, 1
    # bezier = easeOutCirc,   0,    0.55, 0.45, 1
    # bezier = easeOutExpo,   0.16, 1,    0.3,  1
    # animation = windows,          1, 3,   md3_decel,   popin 60%
    # animation = border,           1, 10,  default
    # animation = fade,             1, 2.5, md3_decel
    # animation = workspaces,       1, 3.5, easeOutExpo, slide
    # animation = specialWorkspace, 1, 3,   md3_decel,   slidevert
}
